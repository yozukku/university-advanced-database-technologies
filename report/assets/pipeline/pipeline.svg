<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 460" width="1440" height="460" role="img" aria-label="Łańcuch kroków make full">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap");
    svg { background: #fff; }
    text { font-family: "IBM Plex Mono", ui-monospace, monospace; }
    .frame { fill: oklch(98.5% 0.003 255); stroke: oklch(85% 0.01 260); stroke-width: 1.2; }
    .lane { font-size: 15px; font-weight: 500; fill: oklch(51% 0.11 255); }
    .step rect { fill: #fff; stroke: oklch(70% 0.012 260); stroke-width: 1.4; }
    .name { font-size: 17px; font-weight: 600; fill: oklch(25% 0.015 260); text-anchor: middle; }
    .sub { font-size: 12.5px; font-weight: 500; fill: oklch(51% 0.11 255); text-anchor: middle; }
    .out { font-size: 12.5px; fill: oklch(54% 0.013 260); text-anchor: middle; }
    .note { font-size: 14px; fill: oklch(40% 0.015 260); }
    .edge { fill: none; stroke: oklch(47% 0.02 260); stroke-width: 1.5; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 z" fill="oklch(47% 0.02 260)"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#fff"/>
  <rect class="frame" x="20" y="20" width="1400" height="180" rx="12"/>
  <text class="lane" x="40" y="52">dla każdego rozmiaru z SIZES, po kolei (XS, S, M, L)</text>
  <rect class="frame" x="20" y="260" width="1400" height="180" rx="12"/>
  <text class="lane" x="140" y="292">na końcu, raz dla wszystkich rozmiarów</text>
  <text class="note" x="640" y="344">Każdy wykonany krok dopisuje linię do full-run.jsonl:</text>
  <text class="note" x="640" y="366">rozmiar, krok, SZBD, state_id, czas i kod wyjścia.</text>
  <text class="note" x="640" y="388">Krok z niezmienionym kluczem wejść jest pomijany.</text>
