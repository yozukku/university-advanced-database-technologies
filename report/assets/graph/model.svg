    <text class="table" x="690" y="397">reservation_</text>
  </g>
  <g class="node">
    <rect x="35" y="510" width="200" height="60" rx="10"/>
    <text class="label" x="135" y="536">Lockermat</text>
    <text class="table" x="135" y="557">lockermat_</text>
  </g>
  <g class="node">
    <rect x="340" y="510" width="200" height="60" rx="10"/>
    <text class="label" x="440" y="536">Cell</text>
    <text class="table" x="440" y="557">lockermat_cell_</text>
  </g>
  <g class="node">
    <rect x="590" y="510" width="200" height="60" rx="10"/>
    <text class="label" x="690" y="536">AccessCode</text>
    <text class="table" x="690" y="557">access_code_</text>
  </g>
  <g class="node">
    <rect x="1030" y="510" width="200" height="60" rx="10"/>
    <text class="label" x="1130" y="536">Incident</text>
    <text class="table" x="1130" y="557">incident_</text>
  </g>
  <g class="node">
    <rect x="810" y="640" width="200" height="60" rx="10"/>
    <text class="label" x="910" y="666">CellOpening</text>
    <text class="table" x="910" y="687">cell_opening_</text>
  </g>
  <g class="node">
    <rect x="20" y="670" width="230" height="60" rx="10"/>
    <text class="label" x="135" y="696">OpeningHours</text>
    <text class="table" x="135" y="717">lockermat_opening_hours_</text>
  </g>
  <text class="note" x="135" y="114">bez relacji; actor i changes</text>
  <text class="note" x="135" y="132">jako tekst JSON</text>
</svg>
