<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 780" width="1270" height="780" role="img" aria-label="Model grafowy Bagażomatu w Neo4j">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap");
    svg { background: #fff; }
    text { font-family: "IBM Plex Mono", ui-monospace, monospace; }
    .node rect { fill: oklch(99.9% 0.001 255); stroke: oklch(70% 0.012 260); stroke-width: 1.4; }
    .node.lonely rect { stroke-dasharray: 6 4; }
    .label { font-size: 17px; font-weight: 600; fill: oklch(25% 0.015 260); text-anchor: middle; }
    .extra { font-weight: 500; fill: oklch(51% 0.11 255); }
    .table { font-size: 12.5px; fill: oklch(54% 0.013 260); text-anchor: middle; }
    .note { font-size: 12.5px; fill: oklch(54% 0.013 260); text-anchor: middle; }
    .edge { fill: none; stroke: oklch(47% 0.02 260); stroke-width: 1.5; marker-end: url(#arrow); }
    .rel { font-size: 12.5px; font-weight: 500; fill: oklch(51% 0.11 255); text-anchor: middle; dominant-baseline: middle;
           paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 z" fill="oklch(47% 0.02 260)"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#fff"/>
  <path class="edge" d="M135 573 L135 667"/>
  <text class="rel" x="135" y="620">HAS_HOURS</text>
  <path class="edge" d="M238 540 L337 540"/>
  <text class="rel" x="287.5" y="540">HAS_CELL</text>
  <path class="edge" d="M518.4 93 L641.6 177"/>
  <text class="rel" x="580" y="135">PLACED</text>
  <path class="edge" d="M738.4 177 L861.6 93"/>
  <text class="rel" x="800" y="135">PRICED_BY</text>
  <path class="edge" d="M690 243 L690 347"/>
  <text class="rel" x="690" y="295">HAS_LEG</text>
  <path class="edge" d="M638.4 413 L491.6 507"/>
  <text class="rel" x="565" y="460">IN_CELL</text>
  <path class="edge" d="M690 413 L690 507"/>
  <text class="rel" x="690" y="460">HAS_CODE</text>
  <path class="edge" d="M1039.2 507 L780.8 413"/>
  <text class="rel" x="910" y="460">ABOUT</text>
  <path class="edge" d="M854.2 637 L745.8 573"/>
  <text class="rel" x="800" y="605">OPENED_WITH</text>
  <path class="edge" d="M965.8 637 L1074.2 573"/>
  <text class="rel" x="1020" y="605">OPENED_FOR</text>
  <path class="edge" d="M818 210 L1027 210"/>
  <text class="rel" x="922.5" y="210">HAS_PAYMENT</text>
  <path class="edge" d="M1130 243 L1130 507"/>
  <text class="rel" x="1130" y="375">COMPENSATES</text>
  <path class="edge" d="M1130 573 V743 Q1130 755 1118 755 H452 Q440 755 440 743 V573"/>
  <text class="rel" x="785" y="755">AT_CELL</text>
  <path class="edge" d="M95 507 C85 437 185 437 175 507"/>
  <text class="rel" x="135" y="449">SHIPS_TO</text>
  <path class="edge" d="M1090 177 C1080 107 1180 107 1170 177"/>
  <text class="rel" x="1130" y="119">REFUND_OF</text>
  <g class="node lonely">
    <rect x="35" y="30" width="200" height="60" rx="10"/>
    <text class="label" x="135" y="56">AuditEvent</text>
    <text class="table" x="135" y="77">audit_event_</text>
  </g>
  <g class="node">
    <rect x="370" y="30" width="200" height="60" rx="10"/>
    <text class="label" x="470" y="56">Customer</text>
    <text class="table" x="470" y="77">customer_</text>
  </g>
  <g class="node">
    <rect x="810" y="30" width="200" height="60" rx="10"/>
    <text class="label" x="910" y="56">Tariff</text>
    <text class="table" x="910" y="77">tariff_</text>
  </g>
  <g class="node">
    <rect x="565" y="180" width="250" height="60" rx="10"/>
    <text class="label" x="690" y="206">Order<tspan class="extra"> :Shipment</tspan></text>
    <text class="table" x="690" y="227">order_, shipment_</text>
  </g>
  <g class="node">
    <rect x="1030" y="180" width="200" height="60" rx="10"/>
    <text class="label" x="1130" y="206">Payment</text>
    <text class="table" x="1130" y="227">payment_</text>
  </g>
  <g class="node">
    <rect x="590" y="350" width="200" height="60" rx="10"/>
